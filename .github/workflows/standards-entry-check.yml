name: standards-entry-check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  standards-entry-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout HNPlugins/.github
        uses: actions/checkout@v4
        with:
          repository: HNPlugins/.github
          ref: master
          path: org-dotgithub

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run standards entry check
        run: python org-dotgithub/.github/scripts/standards_entry_check.py repo
